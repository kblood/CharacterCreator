<html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CharacterCreator</title><link rel="icon" href="data:,">
<style>
 html,body{margin:0;height:100%;background:#1b1d22;color:#ddd;font:13px system-ui,sans-serif}
 #ui{position:fixed;top:0;right:0;bottom:0;width:260px;box-sizing:border-box;padding:12px;background:#23262dcc;overflow:auto}
 label{display:block;margin:10px 0 2px}.v{float:right;opacity:.6}
 input[type=range]{width:100%} input[type=color]{width:100%;height:30px;border:0;padding:0}
 button{margin-top:14px;width:100%;padding:6px;background:#3a3f4a;color:#eee;border:1px solid #555;border-radius:4px;cursor:pointer}
 button:hover{background:#474d5a}
 button:disabled{opacity:.5;cursor:default}
 select{display:block;width:100%;padding:6px;background:#3a3f4a;color:#eee;border:1px solid #555;border-radius:4px;font:inherit}
 canvas{display:block}
 details{border-top:1px solid #444;margin-top:8px;padding-top:4px} details:first-child{border-top:0;margin-top:0}
 summary{cursor:pointer;font-weight:600;padding:4px 0;color:#eee}
 label.check{display:flex;align-items:center;gap:6px;cursor:pointer} label.check input{margin:0}
 fieldset.seg{display:flex;border:0;margin:10px 0 2px;padding:0;gap:0} fieldset.seg legend{padding:0;margin-bottom:4px}
 fieldset.seg label{flex:1;margin:0;cursor:pointer} fieldset.seg input{position:absolute;opacity:0;pointer-events:none}
 fieldset.seg label{display:block;text-align:center;padding:6px;background:#3a3f4a;border:1px solid #555;color:#ccc}
 fieldset.seg label:first-of-type{border-radius:4px 0 0 4px} fieldset.seg label:last-of-type{border-radius:0 4px 4px 0;border-left:0}
 fieldset.seg label:has(input:checked){background:#5b6b8a;color:#fff;border-color:#7d8db0}
 fieldset.seg label:has(input:focus-visible){outline:2px solid #9ab}
 details[hidden]{display:none}
 .colors{display:grid;grid-template-columns:auto 1fr;gap:4px 8px;align-items:center;margin-top:4px}
 .colors label.inline{margin:0;opacity:.8} .colors input[type=color]{height:24px} .colors [hidden]{display:none}
 #status{position:fixed;left:12px;top:12px;max-width:min(60ch,calc(100% - 300px));padding:8px 12px;border-radius:4px;background:#23262dcc}
 #status:empty{display:none}
 #status.error{background:#5a1f24;color:#fff;white-space:pre-wrap}
 @media (max-width:600px){#ui{top:auto;left:0;width:auto;height:45%}#status{max-width:calc(100% - 24px)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script>
 // Shown if main.js (or three.js from the CDN) cannot be loaded; main.js sets window.__booted.
 function __fatal(msg){var s=document.getElementById('status');if(!s)return;s.className='error';s.textContent=msg;}
 var __en=/[?&]lang=en\b/.test(location.search);
 var __bootMsg=__en?'Could not load the 3D engine (three.js from cdn.jsdelivr.net). Check your network connection and reload.'
                  :'Kunne ikke indlæse 3D-motoren (three.js fra cdn.jsdelivr.net). Tjek netforbindelsen og genindlæs siden.';

</script>
</head><body><div id="status"></div><div id="ui"></div>
<script type="module" src="main.js" onerror="__fatal(__bootMsg)"></script></body></html>
